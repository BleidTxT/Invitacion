<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos, morenita 💌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  background:radial-gradient(circle at top,#fff8e1,#ffe082,#fbc02d);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:"Poppins",sans-serif;
}

/* ✨ Carta */
.envelope{
  position:relative;
  width:340px;
  height:220px;
  background:#ffecb3;
  border:3px solid #d7b43f;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:transform 1s ease;
  transform-style:preserve-3d;
  cursor:pointer;
}
.envelope.open{
  transform:rotateX(180deg);
}
.front,.back{
  position:absolute;
  width:100%;height:100%;
  backface-visibility:hidden;
  border-radius:10px;
}
.front{
  background:linear-gradient(145deg,#fff59d,#fdd835);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.front h2{
  color:#5d4037;
  font-size:1.6rem;
  margin-bottom:0.5rem;
}
.front p{
  font-size:1rem;
  color:#8d6e63;
}

.back{
  background:#fffde7;
  transform:rotateX(180deg);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:25px;
}
.back p{
  color:#5d4037;
  font-size:1.1rem;
  margin-bottom:15px;
}

/* 🌻 Botones */
.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  align-items:center;
}
button{
  padding:10px 22px;
  border:none;
  border-radius:20px;
  font-weight:bold;
  color:#4e342e;
  background:#ffca28;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}
button:hover{
  background:#ffd54f;
  transform:scale(1.1);
}

/* ✨ Fondo brillante */
.spark{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:rgba(255,255,255,0.8);
  animation:sparkle 6s linear infinite;
}
@keyframes sparkle{
  0%{transform:translateY(100vh) scale(0.5);opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-10vh) scale(1);opacity:0;}
}

/* 🎶 Icono de música */
.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ffca28;
  color: #4e342e;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  cursor: pointer;
  font-size: 22px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  transition: 0.3s;
}
.music-btn:hover {
  transform: scale(1.1);
}
</style>
</head>
<body>

<!-- ✨ Brillitos -->
<div class="spark" style="left:10%;animation-delay:0s;"></div>
<div class="spark" style="left:25%;animation-delay:2s;"></div>
<div class="spark" style="left:60%;animation-delay:1s;"></div>
<div class="spark" style="left:75%;animation-delay:3s;"></div>
<div class="spark" style="left:90%;animation-delay:4s;"></div>

<!-- 💌 Carta -->
<div class="envelope" id="envelope">
  <div class="front">
    <h2>Para vos, morenita 💛🌻</h2>
    <p>Haz clic para abrir 💌</p>
  </div>

  <div class="back">
    <p>Con cariño, tu amor 💕</p>
    <div class="buttons">
      <button id="goToFlor1">Ver Flor 1 🌸</button>
      <button id="goToFlor2">Ver Flor 2 🌻</button>
    </div>
  </div>
</div>

<!-- 🎵 Música oculta -->
<audio id="bgMusic" loop>
  <source src="Paulo Londra - Nena Maldicion (Official Video).mp3" type="audio/mpeg">
  Tu navegador no soporta audio.
</audio>

<!-- 🎵 Botón para pausar/reanudar -->
<button id="musicToggle" class="music-btn" title="Música 🎶">🎵</button>

<script>
const envelope=document.getElementById("envelope");
const btn1=document.getElementById("goToFlor1");
const btn2=document.getElementById("goToFlor2");
const music=document.getElementById("bgMusic");
const musicBtn=document.getElementById("musicToggle");
let isPlaying=false;

// 💌 abrir carta
envelope.addEventListener("click",()=>{
  envelope.classList.toggle("open");
  if(!isPlaying){
    music.play().catch(()=>{});
    isPlaying=true;
  }
});

// 🌸 redirección
btn1.addEventListener("click",e=>{
  e.stopPropagation();
  window.location.href="flor1.html";
});

// 🌻 redirección
btn2.addEventListener("click",e=>{
  e.stopPropagation();
  window.location.href="flor2.html";
});

// 🎵 botón de música
musicBtn.addEventListener("click",()=>{
  if(isPlaying){
    music.pause();
  }else{
    music.play().catch(()=>{});
  }
  isPlaying=!isPlaying;
});
</script>

</body>
</html>
